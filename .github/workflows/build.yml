name: Build Total Warfare DLL

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository layout
        shell: cmd
        run: |
          echo === ROOT ===
          dir
          echo === mods (if exists) ===
          if exist mods (dir mods) else (echo NO mods folder)

      - name: Prepare source files
        shell: cmd
        run: |
          if not exist mods mkdir mods
          if exist "Total Warfare Overhaul\mods\total_warfare.c" xcopy /Y /I "Total Warfare Overhaul\mods\*" mods\
          if exist total_warfare.c if not exist mods\total_warfare.c copy /Y total_warfare.c mods\
          if exist mercenaries_mod.h if not exist mods\mercenaries_mod.h copy /Y mercenaries_mod.h mods\
          if exist mercfx.h if not exist mods\mercfx.h copy /Y mercfx.h mods\
          echo === mods after prepare ===
          dir mods

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        working-directory: mods
        run: |
          if not exist total_warfare.c (
            echo ERROR: mods\total_warfare.c is missing from the repository.
            exit /b 1
          )
          cl /nologo /W4 /O2 /LD /I . total_warfare.c /Fe:total_warfare.dll /link /MACHINE:X64

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: total_warfare-dll
          path: mods/total_warfare.dll
          if-no-files-found: error
